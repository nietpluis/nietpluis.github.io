<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jouw oplossing — Dossier 001</title>
    <link rel="stylesheet" href="../assets/css/dossier-popups.css">
  </head>
  <body>
    <main class="popup-sheet">
      <button class="popup-close" type="button" aria-label="Sluiten" data-popup-close>×</button>
      <h1>Jouw oplossing</h1>
      <p>Wie maakte de foto, op welk apparaat en met welke app?</p>
      <div class="answer">
        <label>Wie?<select id="answer-person"></select></label>
        <label>Apparaat<select id="answer-device"></select></label>
        <label>App<select id="answer-app"></select></label>
      </div>
      <div class="popup-actions">
        <button id="check-answer" type="button">Controleer mijn antwoord</button>
        <button type="button" data-popup-close>Terug naar de tafel</button>
      </div>
      <p class="result" id="answer-result" role="status"></p>
    </main>
    <script src="../assets/js/dossier-answer.js" defer></script>
    <script src="../assets/js/dossier-popup-controls.js" defer></script>
  </body>
</html>
