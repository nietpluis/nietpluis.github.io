<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bewijs — Dossier 001</title>
    <link rel="stylesheet" href="../assets/css/dossier-popups.css">
  </head>
  <body>
    <main class="popup-sheet">
      <button class="popup-close" type="button" aria-label="Sluiten" data-popup-close>×</button>
      <h1>Bewijs</h1>
      <p>Vink een aanwijzing af wanneer je deze hebt verwerkt.</p>
      <label class="clue"><input type="checkbox"><span><strong>Bewijs 1: Een berichtje</strong><br>Pas na de les zag Riya dat iemand haar een bericht had gestuurd: “Hoi Riya, ik stuur dit even vanaf mijn laptop. Zullen we vanavond naar de bioscoop gaan?”</span></label>
      <label class="clue"><input type="checkbox"><span><strong>Bewijs 2: Het bureau</strong><br>Alleen het bureau van de docent was groot genoeg voor een computer.</span></label>
      <label class="clue"><input type="checkbox"><span><strong>Bewijs 3: Woordjes leren</strong><br>Noor was druk bezig woordjes uit haar hoofd te leren.</span></label>
      <label class="clue"><input type="checkbox"><span><strong>Bewijs 4: Vergeten</strong><br>Degene die op Quizlet zat, was haar laptop vergeten mee te nemen.</span></label>
      <label class="clue"><input type="checkbox"><span><strong>Bewijs 5: Berichten sturen</strong><br>De leerlingen communiceren liever via WhatsApp dan met Instagram.</span></label>
      <label class="clue"><input type="checkbox"><span><strong>Bewijs 6: Een nieuw record</strong><br>Mevrouw de Graaf heeft tijdens de les haar hoogste score op 99 Nights in the Forest verbeterd.</span></label>
      <label class="clue"><input type="checkbox"><span><strong>Bewijs 7: Het kluisje</strong><br>Degene die aan het einde van de zomer jarig is, heeft haar telefoon netjes in haar kluisje gelegd.</span></label>
      <div class="popup-actions">
        <button type="button" data-popup-close>Terug naar de tafel</button>
        <button type="button" data-popup-open="rooster">Open onderzoeksrooster</button>
      </div>
    </main>
    <script src="../assets/js/dossier-popup-controls.js" defer></script>
  </body>
</html>
